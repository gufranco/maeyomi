[project]
name = "maeyomi"
version = "1.24.1"
description = "Print playable cards for Barcode Battler machines and barcode games"
readme = "README.md"
authors = [{ name = "Gustavo Franco", email = "gufranco@users.noreply.github.com" }]
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "pydantic==2.14.1",
    "pillow==13.0.0",
    "reportlab==5.1.0",
    "typer==0.27.3",
    "zxing-cpp==3.1.1",
    "pypdfium2==5.14.0",
]

[project.scripts]
maeyomi = "maeyomi.cli.main:app"

[project.optional-dependencies]
ui = ["fastapi==0.159.1", "uvicorn==0.54.0"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.5",
    "ruff==0.17.1",
    "pyright==1.1.414",
    "httpx2==2.16.0",
    "import-linter==2.15",
    "cosmic-ray==8.7.0",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
constraint-dependencies = ["opentelemetry-api>=1.45.1"]

[tool.uv.build-backend]
module-name = "maeyomi"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "COM812",
    "S101",
    "CPY001",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "INP001", "D100", "D101", "D102", "D103", "D104", "FBT001", "RUF001"]
"src/maeyomi/gameboy/kattobi_tables.py" = ["RUF001"]
"src/maeyomi/decoder/front_read.py" = ["PLR0913"]
"src/maeyomi/decoder/back_read.py" = ["PLR0913"]
"src/maeyomi/generator/front_solver.py" = ["PLR0913", "PLR0917"]
"src/maeyomi/generator/random_cards.py" = ["S311"]
"src/maeyomi/generator/device_random.py" = ["S311"]
"src/maeyomi/rendering/card.py" = ["PLR0913"]
"src/maeyomi/rendering/sheet.py" = ["PLR0913"]
"src/maeyomi/rendering/preview.py" = ["PLR0913"]
"src/maeyomi/cli/main.py" = ["PLR0913", "PLR0917", "FBT002"]
"src/maeyomi/cli/common.py" = ["PLR0913"]
"src/maeyomi/cli/game_device.py" = ["PLR0913"]
"src/maeyomi/official/catalogue.py" = ["RUF001"]
"src/maeyomi/models/special_ability_ja.py" = ["RUF001"]
"src/maeyomi/bb1/flags.py" = ["RUF001"]
"src/maeyomi/double/abilities.py" = ["RUF001"]
"src/maeyomi/datach/sdgundam_names.py" = ["RUF001"]
"tools/*" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.importlinter]
root_package = "maeyomi"

[[tool.importlinter.contracts]]
name = "The decoder stays a pure port"
type = "forbidden"
source_modules = ["maeyomi.decoder"]
forbidden_modules = [
    "maeyomi.barcode",
    "maeyomi.cli",
    "maeyomi.generator",
    "maeyomi.games",
    "maeyomi.official",
    "maeyomi.products",
    "maeyomi.rendering",
    "maeyomi.ui",
]

[[tool.importlinter.contracts]]
name = "The domain core avoids transport and presentation"
type = "forbidden"
source_modules = ["maeyomi.models", "maeyomi.barcode"]
forbidden_modules = [
    "maeyomi.cli",
    "maeyomi.generator",
    "maeyomi.games",
    "maeyomi.official",
    "maeyomi.products",
    "maeyomi.rendering",
    "maeyomi.ui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/maeyomi"]
branch = true

[tool.coverage.report]
show_missing = true

