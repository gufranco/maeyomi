[project]
name = "barcode-battler"
version = "0.1.0"
description = "Generate printable Barcode Battler II compatible cards"
readme = "README.md"
authors = [{ name = "Gustavo Franco", email = "gufranco@users.noreply.github.com" }]
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "pydantic==2.13.5",
    "pillow==12.3.0",
    "reportlab==5.0.1",
    "typer==0.27.2",
    "zxing-cpp==3.1.1",
    "pypdfium2==5.13.0",
]

[project.scripts]
barcode-battler = "barcode_battler.cli.main:app"

[project.optional-dependencies]
ui = ["fastapi==0.141.1", "uvicorn==0.53.0"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.0",
    "ruff==0.16.8",
    "pyright==1.1.414",
    "httpx2==2.13.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "barcode_battler"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "COM812",
    "S101",
    "CPY001",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "INP001", "D100", "D101", "D102", "D103", "D104", "FBT001"]
"src/barcode_battler/decoder/front_read.py" = ["PLR0913"]
"src/barcode_battler/decoder/back_read.py" = ["PLR0913"]
"src/barcode_battler/generator/front_solver.py" = ["PLR0913", "PLR0917"]
"src/barcode_battler/generator/random_cards.py" = ["S311"]
"src/barcode_battler/rendering/card.py" = ["PLR0913"]
"src/barcode_battler/rendering/sheet.py" = ["PLR0913"]
"src/barcode_battler/rendering/preview.py" = ["PLR0913"]
"src/barcode_battler/cli/main.py" = ["PLR0913", "PLR0917", "FBT002"]
"tools/*" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
source = ["src/barcode_battler"]
branch = true

[tool.coverage.report]
show_missing = true
