---
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, types and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra ui

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run pyright

      - name: Tests
        run: uv run pytest --cov=maeyomi --cov-fail-under=100

      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --extra ui --no-emit-project \
            --format requirements-txt > "${RUNNER_TEMP}/requirements.txt"
          uv run pip-audit -r "${RUNNER_TEMP}/requirements.txt" --strict

      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" dir . --no-banner --redact

      - name: Check the machine
        run: uv run maeyomi doctor

      - name: Check that GitHub says what the README says
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-public-text.sh

  accessibility:
    name: accessibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Install
        run: |
          set -euo pipefail
          uv sync --frozen --extra ui
          npm ci --prefix tools/render
          tools/render/node_modules/.bin/playwright install --with-deps chromium

      - name: Accessibility
        run: |
          set -euo pipefail
          uv run maeyomi serve --port 8000 &
          server=$!
          trap 'kill "${server}" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "${ready}" -ne 1 ]; then
            echo "server did not become ready" >&2
            exit 1
          fi
          node tools/render/accessibility.playwright.e2e.mjs
